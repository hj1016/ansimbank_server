server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ansimbank
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ansimbank}
    username: ${DB_USERNAME:ansimbank}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

clova:
  stt:
    url: ${CLOVA_STT_URL}
    clientId: ${CLOVA_STT_CLIENT_ID}
    clientSecret: ${CLOVA_STT_CLIENT_SECRET}
  tts:
    url: ${CLOVA_TTS_URL}
    clientId: ${CLOVA_TTS_CLIENT_ID}
    clientSecret: ${CLOVA_TTS_CLIENT_SECRET}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

jwt:
  secret: ${JWT_SECRET}

codef:
  client-id: ${CODEF_CLIENT_ID}
  client-secret: ${CODEF_CLIENT_SECRET}
  public-key: ${CODEF_PUBLIC_KEY}
  demo-domain: ${CODEF_DEMO_DOMAIN:https://development.codef.io}
  oauth-domain: ${CODEF_OAUTH_DOMAIN:https://oauth.codef.io}
