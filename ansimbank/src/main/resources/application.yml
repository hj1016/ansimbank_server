server:
  port: 8080

spring:
  application:
    name: ansimbank-server

  datasource:
    url: jdbc:mysql://localhost:3306/ansimbank?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: password
    # driver-class-name: com.mysql.cj.jdbc.Driver   # 생략 가능 (자동 감지)
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  # 필요시 로깅
  # jpa.show-sql: true
clova:
  stt:
    url: https://naveropenapi.apigw.ntruss.com/recog/v1/stt?lang=Kor
    clientId:  ${CLOVA_STT_CLIENT_ID}
    clientSecret: ${CLOVA_STT_SECRET}
  tts:
    url: https://naveropenapi.apigw.ntruss.com/tts-premium/v1/tts
    clientId: ${CLOVA_STT_CLIENT_ID}
    clientSecret: ${CLOVA_STT_SECRET}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}
  project-id: ${FIREBASE_PROJECT_ID}

jwt:
  secret: mySecretKeyForORoomApplicationJWT2024VerySafeAndSecure

